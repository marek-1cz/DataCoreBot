<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">
<title>Oznámení | OIS IDPK</title>
<meta name="description" content="Návrh vzhledu oznámení, které se zobrazuje nahoře na celém webu OIS IDPK.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%9A%8C%3C/text%3E%3C/svg%3E">
<script>
/* Lehký režim: respektuje výkonnostní profil z hlavního webu (stejný localStorage) a „omezit pohyb“ v systému */
(function(){var d=document.documentElement,m=null;try{m=localStorage.getItem('ois-perf-mode')}catch(e){}
if(m==='low'||m==='min'||matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('lite');})();
</script>
<style>
/* =========================================================
   BARVY – stejné jako na hlavním webu
   ========================================================= */
:root{
  --bg:#05070f; --navy:#0a1230; --blue:#2f6bff; --cyan:#38d6ff; --yellow:#ffc933; --green:#35d07f; --red:#ff6b6b;
  --text:#eaf0ff; --muted:#9fb0d6;
  --glass:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.14);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
h1,h2,h3{line-height:1.1;letter-spacing:-.02em}
.wrap{max-width:1180px;margin:0 auto;padding:0 5vw}
.grad{background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* ============ POZADÍ ============ */
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aurora span{position:absolute;border-radius:50%;filter:blur(120px)}
.aurora .a{width:60vw;height:60vw;left:-15vw;top:-15vw;background:rgba(47,107,255,.30);animation:drift 40s ease-in-out infinite alternate}
.aurora .b{width:55vw;height:55vw;right:-20vw;top:25vh;background:rgba(14,36,140,.45);animation:drift 50s ease-in-out infinite alternate-reverse}
.aurora .c{width:45vw;height:45vw;left:20vw;bottom:-25vw;background:rgba(47,107,255,.18)}
.aurora .d{width:30vw;height:30vw;right:5vw;bottom:-10vw;background:rgba(53,208,127,.07)}
.aurora .e{width:28vw;height:28vw;left:2vw;top:55vh;background:rgba(255,201,51,.05)}
@keyframes drift{to{transform:translate(6vw,4vh)}}
html.lite .aurora span{animation:none;filter:blur(70px)}

/* ============ HLAVIČKA STRÁNKY ============ */
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-border);font-size:.82rem;color:var(--muted);margin-bottom:16px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.eyebrow i.y{background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.kicker{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:16px;font-size:.76rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.kicker::before,.kicker::after{content:"";width:28px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.kicker::after{background:linear-gradient(270deg,var(--blue),var(--cyan))}

/* =====================================================================
   ===== KOMPONENTA OZNÁMENÍ: CSS (zkopírovat do společného CSS webu) =====
   Proměnná --notify-top = odsazení shora (pod horní lištu webu, např. 96px).
   ===================================================================== */
#ois-notices{position:fixed;left:0;right:0;top:var(--notify-top,12px);z-index:90;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 12px;pointer-events:none}
.nt{--nc:#38d6ff;position:relative;display:flex;align-items:center;gap:14px;width:100%;max-width:940px;padding:14px 16px 14px 14px;border-radius:22px;overflow:hidden;pointer-events:auto;
  background:linear-gradient(135deg,color-mix(in srgb,var(--nc) 20%,rgba(8,13,34,.96)),rgba(8,13,34,.96) 62%);
  border:1px solid color-mix(in srgb,var(--nc) 55%,transparent);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04) inset,0 0 34px color-mix(in srgb,var(--nc) 22%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:ntIn .7s var(--ease,cubic-bezier(.2,.7,.2,1)) both}
.nt.out{animation:ntOut .45s var(--ease,cubic-bezier(.2,.7,.2,1)) forwards}
@keyframes ntIn{0%{opacity:0;transform:translateY(-36px) scale(.94)}60%{transform:translateY(5px) scale(1.01)}100%{opacity:1;transform:none}}
@keyframes ntOut{to{opacity:0;transform:translateY(-22px) scale(.96);max-height:0;padding-top:0;padding-bottom:0;margin-top:-10px}}
.nt.info{--nc:#38d6ff}.nt.success{--nc:#35d07f}.nt.warning{--nc:#ffc933}.nt.danger{--nc:#ff6b6b}.nt.maintenance{--nc:#ffc933}.nt.rebuild{--nc:#2f6bff}
.nt-ic{flex:none;position:relative;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--nc) 22%,transparent);color:var(--nc)}
.nt-ic::after{content:"";position:absolute;inset:-4px;border-radius:19px;border:2px solid var(--nc);opacity:0;animation:ntRing 2.6s ease-out infinite}
@keyframes ntRing{0%{opacity:.6;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
.nt-ic svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nt.rebuild .nt-ic svg{animation:ntSpin 3.4s linear infinite}
.nt.maintenance .nt-ic svg{animation:ntWrench 2.2s ease-in-out infinite;transform-origin:50% 50%}
.nt.warning .nt-ic svg,.nt.danger .nt-ic svg{animation:ntShake 3.2s ease-in-out infinite}
.nt.success .nt-ic svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:ntDraw .7s .3s var(--ease,ease) forwards}
@keyframes ntSpin{to{transform:rotate(360deg)}}
@keyframes ntWrench{50%{transform:rotate(-18deg)}}
@keyframes ntShake{0%,86%,100%{transform:none}90%{transform:rotate(-9deg)}94%{transform:rotate(9deg)}97%{transform:rotate(-5deg)}}
@keyframes ntDraw{to{stroke-dashoffset:0}}
.nt-b{flex:1;min-width:0}
.nt-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.nt-t b{font-size:1rem;letter-spacing:-.01em}
.nt-tag{padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--nc) 24%,transparent);color:var(--nc);font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.nt-p{color:#c9d5f2;font-size:.9rem;line-height:1.45;overflow-wrap:anywhere}
.nt-cd{display:inline-flex;align-items:center;gap:6px;margin-top:7px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.nt-cd i{width:7px;height:7px;border-radius:50%;background:var(--nc);box-shadow:0 0 8px var(--nc);animation:ntBlink 1.4s infinite}
@keyframes ntBlink{50%{opacity:.3}}
.nt-go{flex:none;padding:9px 18px;border-radius:999px;background:var(--nc);color:#05070f;font-weight:800;font-size:.84rem;white-space:nowrap;transition:transform .25s var(--ease,ease),box-shadow .25s}
.nt-go:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--nc) 45%,transparent)}
.nt.rebuild .nt-go{color:#fff}
.nt-x{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);color:#c9d5f2;font-size:1.2rem;line-height:1;transition:transform .3s var(--ease,ease),background .25s}
.nt-x:hover{background:rgba(255,255,255,.18);transform:rotate(90deg)}
/* spodní pruh: údržba = pruhy, předělávání = průběh */
.nt-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06)}
.nt.maintenance .nt-bar{background:repeating-linear-gradient(135deg,#ffc933 0 12px,#1a1300 12px 24px);background-size:34px 34px;animation:ntStripes 1.1s linear infinite;opacity:.9}
@keyframes ntStripes{to{background-position:34px 0}}
.nt.rebuild .nt-bar i{display:block;height:100%;width:var(--p,38%);border-radius:0 5px 5px 0;background:linear-gradient(90deg,#2f6bff,#38d6ff);position:relative;overflow:hidden;transition:width .8s var(--ease,ease)}
.nt.rebuild .nt-bar i::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:ntShine 1.8s infinite}
.nt.rebuild .nt-bar.ind i{width:35%;animation:ntInd 2.2s ease-in-out infinite alternate}
@keyframes ntShine{to{left:140%}}@keyframes ntInd{to{margin-left:65%}}
.nt-more{pointer-events:auto;padding:7px 16px;border-radius:999px;background:rgba(8,13,34,.92);border:1px solid var(--glass-border,rgba(255,255,255,.14));color:#c9d5f2;font-weight:700;font-size:.8rem;backdrop-filter:blur(12px);animation:ntIn .5s var(--ease,ease) both;transition:background .25s}
.nt-more:hover{background:rgba(47,107,255,.35)}
@media(max-width:620px){
  #ois-notices{padding:0 8px}
  .nt{flex-wrap:wrap;gap:10px 12px;padding:12px;border-radius:20px}
  .nt-b{flex-basis:calc(100% - 118px)}
  .nt-go{order:5;flex:1 1 100%;text-align:center}
  .nt-p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .nt.open .nt-p{-webkit-line-clamp:unset}
}
html.lite .nt,html.lite .nt *,html.lite .nt-more{animation-duration:.01s!important;animation-iteration-count:1!important}
@media(prefers-reduced-motion:reduce){.nt,.nt *{animation-duration:.01s!important;animation-iteration-count:1!important}}
/* ===== konec komponenty ===== */

/* ukázková stránka */
.hero{padding-top:var(--nav-offset,140px);padding-bottom:20px;text-align:center}
.hero h1{font-size:clamp(2rem,5.4vw,3.4rem);margin-bottom:12px}.hero .lead{color:var(--muted);max-width:640px;margin:0 auto}
.card{padding:24px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(14px)}
.main{max-width:920px;margin:0 auto;padding-bottom:80px}
.card h2{font-size:1.2rem;margin-bottom:6px}.card p.s{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.pillb{padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-border);font-weight:700;font-size:.86rem;color:var(--text);transition:all .25s}
.pillb:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.pillb.y{border-color:rgba(255,201,51,.6);color:var(--yellow)}.pillb.r{border-color:rgba(255,107,107,.6);color:#ffb0b0}
.fake{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.fake i{display:block;height:120px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-border)}
.vzor{display:inline-block;padding:2px 8px;border-radius:6px;background:rgba(255,201,51,.14);color:var(--yellow);border:1px dashed rgba(255,201,51,.65);font:800 .64rem/1.4 system-ui,sans-serif;letter-spacing:.14em;vertical-align:middle}
.vzorbar{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px;padding:14px 18px;border-radius:18px;background:rgba(255,201,51,.08);border:1px dashed rgba(255,201,51,.6);font-size:.9rem;line-height:1.5}
.vzorbar b{color:var(--yellow);letter-spacing:.1em}.vzorbar code{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-size:.85em}
[hidden]{display:none!important}
@media(max-width:620px){.fake{grid-template-columns:1fr}.hero{padding-top:var(--nav-offset,150px)}}

.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:95;width:min(920px,calc(100% - 24px));padding:14px 16px;border-radius:24px;background:rgba(8,13,34,.94)}
.dock h2{font-size:.95rem;margin-bottom:10px}
.dock .btns{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dock .pillb{flex:none}
.fake{grid-template-columns:repeat(3,1fr);margin-bottom:140px}
@media(max-width:620px){.fake{grid-template-columns:1fr 1fr}}

/* Automatická zpráva (build) */
.nt.build{--nc:#a98bff}
.nt.build .nt-ic svg{animation:ntDown 1.6s ease-in-out infinite}
@keyframes ntDown{50%{transform:translateY(3px)}}
.nt.build .nt-bar{background:linear-gradient(90deg,transparent,var(--nc),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:ntSweep 1.6s linear infinite}
@keyframes ntSweep{from{background-position:-60% 0}to{background-position:160% 0}}
.nt.tochip{animation:ntToChip .55s var(--ease,ease) forwards;transform-origin:100% 0}
@keyframes ntToChip{to{opacity:0;transform:translateX(35vw) scale(.12)}}
.nt-chip{pointer-events:auto;align-self:flex-end;display:inline-flex;align-items:center;gap:8px;margin-right:2px;padding:8px 14px 8px 10px;border-radius:999px;background:rgba(8,13,34,.95);border:1px solid color-mix(in srgb,#a98bff 60%,transparent);color:#d8caff;font-weight:800;font-size:.8rem;font-variant-numeric:tabular-nums;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 22px rgba(169,139,255,.3);animation:ntChip .6s var(--ease,ease) both;transition:transform .25s var(--ease,ease)}
.nt-chip:hover{transform:scale(1.06)}
.nt-chip svg{width:22px;height:22px;fill:none;stroke:#a98bff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:ntDown 1.6s ease-in-out infinite}
@keyframes ntChip{from{opacity:0;transform:translateX(60px) scale(.4)}}
.nt-tag.vz{background:rgba(255,201,51,.14);color:#ffc933;border:1px dashed rgba(255,201,51,.65)}

</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span><span class="e"></span></div>
<!-- Sem agent vloží horní lištu webu. Oznámení se zobrazují pod ní (--notify-top). -->
<div id="ois-notices" aria-live="polite" role="region" aria-label="Oznámení"></div>
<section class="card dock"><h2>Vyzkoušet oznámení <span class="vzor">VZOR</span></h2>
    <div class="btns" id="demoBtns">
      <button class="pillb" data-n="warning" type="button">Upozornění</button>
      <button class="pillb r" data-n="danger" type="button">Výpadek</button>
      <button class="pillb" data-n="rebuild" type="button">Průběh</button>
      <button class="pillb y" data-n="maintenance" type="button">Údržba</button>
      <button class="pillb" data-n="info" type="button">Novinka</button>
      <button class="pillb" data-n="success" type="button">Funkční</button>
      <button class="pillb" data-n="build" type="button">Automatická zpráva (mapa)</button>
      <button class="pillb" data-n="buildOther" type="button">Automatická zpráva (ostatní)</button>
      <button class="pillb" data-n="many" type="button">Víc najednou</button>
      <button class="pillb" data-n="clear" type="button">Smazat vše</button>
      <button class="pillb" data-n="reset" type="button">Zapomenout zavřená</button>
    </div></section>
  

<script>
'use strict';
/* =====================================================================
   ===== KOMPONENTA OZNÁMENÍ: JS (zkopírovat do společného skriptu webu) =====
   ---------------------------------------------------------------------
   CONFIG.DEMO:true  -> ukázková tlačítka, nic se nenačítá.
   CONFIG.DEMO:false -> načítá GET CONFIG.api.list a obnovuje ho každých pollSec s.

   GET /api/notices -> { notices:[{
       id:        'unikátní řetězec',
       type:      'warning' | 'danger' | 'rebuild' | 'maintenance' | 'info' | 'success' | 'build'
                  (názvy na webu: Upozornění, Výpadek, Průběh, Údržba, Novinka, Funkční, Automatická zpráva),
       title:     'Nadpis',
       text:      'Text oznámení',
       tag:       'volitelný vlastní štítek; bez něj se ukáže název typu',
       link:      { url:'/cesta', label:'Zjistit více' }   // volitelné
       dismissible: true,        // výchozí true; false = nejde zavřít
       version:   1,             // po zvýšení se zavřené oznámení zobrazí znovu
       priority:  0,             // vyšší se řadí výš (jinak podle typu)
       startsAt:  'ISO datum',   // maintenance: odpočet do začátku údržby
       endsAt:    'ISO datum',   // po tomto čase oznámení zmizí samo
       progress:  62,            // jen rebuild (Průběh): 0-100, bez hodnoty neurčitý pruh
       startedAt: 'ISO datum'    // jen build (Automatická zpráva): kdy začal build z GitHubu
   }] }
   Typ build: nejde zavřít, nepamatuje se. Na stránkách /mapa a /mapa_admin trvá 10 minut
   (velká karta, po 10 s sjede ikonka doprava, kliknutím se zase zvětší), na ostatních
   stránkách jen 30 s. Texty jsou pro mapu a pro ostatní stránky různé (viz BUILD_TEXT níže).
   Zavřená oznámení si prohlížeč pamatuje (localStorage "ois-notice-dismissed").
   ===================================================================== */
(function(){
const CONFIG={DEMO:true,pollSec:120,maxVisible:2,api:{list:'/api/notices'}};
const KEY='ois-notice-dismissed',ORDER={build:6,danger:5,maintenance:4,rebuild:3,warning:2,info:1,success:0};
const TAGS={warning:'Upozornění',danger:'Výpadek',rebuild:'Průběh',maintenance:'Údržba',info:'Novinka',success:'Funkční',build:'Automatická zpráva'};
const BUILD_TEXT={
  map:{title:'Probíhá aktualizace mapy',text:'Po nasazení nové verze se mapa načítá. Několik minut mohou být zobrazená data neúplná nebo nepřesná.'},
  other:{title:'Probíhá aktualizace',text:'Po nasazení nové verze se ještě načítají některá data. Za okamžik se zobrazení ustálí.'}};
const BUILD_MAP_MS=10*60*1000,BUILD_OTHER_MS=30*1000,BUILD_COLLAPSE_MS=10*1000;
const isMapPage=n=>n.demoPage?n.demoPage==='map':/^\/mapa(_admin)?(\/|$)/.test(location.pathname);
const buildEnd=n=>Date.parse(n.startedAt)+(isMapPage(n)?BUILD_MAP_MS:BUILD_OTHER_MS);
const ICON={
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  success:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  warning:'<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v5M12 17.6h.01"/>',
  danger:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
  maintenance:'<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  build:'<path d="M7 18a4 4 0 01-.5-7.97A6 6 0 0118 9.5a4.25 4.25 0 01-.5 8.5"/><path d="M12 11v7M9 15l3 3 3-3"/>',
  rebuild:'<path d="M20 11a8 8 0 00-14.9-3M4 4v4h4M4 13a8 8 0 0014.9 3M20 20v-4h-4"/>'
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host=()=>document.getElementById('ois-notices');
let LIST=[],EXPANDED=false;
function dismissed(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function saveDismiss(id,v){try{const d=dismissed();d[id]=v||1;localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function plural(n,a,b,c){return n+' '+(n===1?a:n<5?b:c)}
function span(ms){const m=Math.max(1,Math.round(ms/60000));
  if(m<60)return plural(m,'minuta','minuty','minut');
  const h=Math.floor(m/60);if(h<24)return plural(h,'hodina','hodiny','hodin')+(m%60?' '+(m%60)+' min':'');
  return plural(Math.floor(h/24),'den','dny','dní')}
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return s>=60?Math.floor(s/60)+':'+('0'+(s%60)).slice(-2):s+' s'}
function countdown(n){
  if(n.type==='build')return 'Ještě '+mmss(buildEnd(n)-Date.now());
  if(n.type!=='maintenance'||!n.startsAt)return'';
  const now=Date.now(),s=Date.parse(n.startsAt),e=n.endsAt?Date.parse(n.endsAt):0;
  if(now<s)return 'Začne za '+span(s-now);
  if(e&&now<e)return 'Probíhá, zbývá '+span(e-now);
  return 'Probíhá';
}
function matchesPage(targets){

  if(!targets||!Array.isArray(targets)||targets.length===0||targets.includes('all')||targets.includes('*'))return true;

  if(typeof CONFIG!=='undefined'&&CONFIG&&CONFIG.DEMO)return true;

  const curPath=(window.location.pathname||'/').toLowerCase().replace(/\/+$/,'')||'/';

  let hashSec=(window.location.hash||'').toLowerCase().replace(/^#\/?/,'').replace(/\/+$/,'');

  if(hashSec==='home')hashSec='';

  const curHash=hashSec?('/'+hashSec):'';

  const eff=[];

  if(curPath==='/'&&curHash){eff.push(curHash)}else{eff.push(curPath);if(curHash&&curHash!==curPath)eff.push(curHash)}

  for(let t of targets){

    if(!t)continue;

    let tn=String(t).trim().toLowerCase();

    if(tn==='all'||tn==='*')return true;

    if(!tn.startsWith('/'))tn='/'+tn;

    tn=tn.replace(/\/+$/,'')||'/';

    for(let ep of eff){

      if(ep===tn)return true;

      if(tn!=='/'&&ep.startsWith(tn+'/'))return true;

    }

  }

  return false;

}

function visible(){
  const now=Date.now(),d=dismissed();
  return LIST.filter(n=>{

  if(!matchesPage(n.target_pages))return false;
    if(n.type==='build'){if(!n.startedAt||buildEnd(n)<now)return false;return true}
    if(n.endsAt&&Date.parse(n.endsAt)<now)return false;
    if(n.type!=='maintenance'&&n.startsAt&&Date.parse(n.startsAt)>now)return false;
    if(n.dismissible!==false&&d[n.id]!=null&&d[n.id]>=(n.version||1))return false;
    return true}).sort((a,b)=>(b.priority||0)-(a.priority||0)||(ORDER[b.type]||0)-(ORDER[a.type]||0));
}
function build(n){
  const el=document.createElement('div'),t=ORDER[n.type]!=null?n.type:'info';
  el.className='nt '+t;el.dataset.id=n.id;el.setAttribute('role',t==='danger'?'alert':'status');
  if(t==='build'){const b=BUILD_TEXT[isMapPage(n)?'map':'other'];n=Object.assign({},n,{title:n.title||b.title,text:n.text||b.text,dismissible:false})}
  const cd=countdown(n),bar=t==='maintenance'?'<div class="nt-bar"></div>':t==='rebuild'?'<div class="nt-bar'+(n.progress==null?' ind':'')+'"><i'+(n.progress!=null?' style="--p:'+Math.max(4,Math.min(100,n.progress))+'%"':'')+'></i></div>':'';
  el.innerHTML='<div class="nt-ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[t]+'</svg></div>'+
   '<div class="nt-b"><div class="nt-t"><b>'+esc(n.title)+'</b>'+'<span class="nt-tag">'+esc(n.tag||TAGS[t])+'</span>'+(n.demo?'<span class="nt-tag vz">VZOR</span>':'')+'</div>'+
   (n.text?'<div class="nt-p">'+esc(n.text)+'</div>':'')+(cd?'<div class="nt-cd"><i></i><span class="cdt">'+esc(cd)+'</span></div>':'')+'</div>'+
   (n.link&&n.link.url?'<a class="nt-go" href="'+esc(n.link.url)+'">'+esc(n.link.label||'Zjistit více')+'</a>':'')+
   (n.dismissible!==false?'<button class="nt-x" type="button" aria-label="Zavřít oznámení">×</button>':'')+bar;
  el._n=n;if(t==='build'&&isMapPage(n))scheduleCollapse(el);
  return el;
}
/* Automatická zpráva na mapě: po 10 s sjede ikonka doprava, kliknutím se zase zvětší */
function scheduleCollapse(el){clearTimeout(el._ct);el._ct=setTimeout(()=>collapse(el),BUILD_COLLAPSE_MS)}
function collapse(el){
  if(!el.isConnected||el._chip)return;
  el.classList.add('tochip');
  setTimeout(()=>{
    if(!el.isConnected)return;el.style.display='none';
    const c=document.createElement('button');c.type='button';c.className='nt-chip';c.setAttribute('aria-label','Zobrazit automatickou zprávu');
    c.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICON.build+'</svg><span class="chip-t">'+esc(mmss(buildEnd(el._n)-Date.now()))+'</span>';
    c.addEventListener('click',()=>{c.remove();el._chip=null;el.classList.remove('tochip');el.style.display='';el.style.animation='none';void el.offsetWidth;el.style.animation='';scheduleCollapse(el)});
    el.after(c);el._chip=c},560);
}
function sync(){
  const H=host();if(!H)return;
  const vis=visible(),show=EXPANDED?vis:vis.slice(0,CONFIG.maxVisible),ids=show.map(n=>n.id);
  Array.from(H.querySelectorAll('.nt')).forEach(el=>{if(ids.indexOf(el.dataset.id)<0&&!el.classList.contains('out')){el.classList.add('out');clearTimeout(el._ct);if(el._chip)el._chip.remove();setTimeout(()=>{if(el._chip)el._chip.remove();el.remove()},460)}});
  let prev=null;
  show.forEach(n=>{
    let el=H.querySelector('.nt[data-id="'+(window.CSS&&CSS.escape?CSS.escape(n.id):n.id)+'"]:not(.out)');
    if(!el){el=build(n);const ref=prev?prev.nextSibling:H.firstChild;H.insertBefore(el,ref)}
    prev=el});
  let m=H.querySelector('.nt-more');const rest=vis.length-show.length;
  if(rest>0||(EXPANDED&&vis.length>CONFIG.maxVisible)){
    if(!m){m=document.createElement('button');m.type='button';m.className='nt-more';H.appendChild(m)}
    m.textContent=EXPANDED?'Skrýt další oznámení':'+ '+plural(rest,'další oznámení','další oznámení','dalších oznámení');
  }else if(m)m.remove();
  const mm=H.querySelector('.nt-more');if(mm)H.appendChild(mm);
}
function tickCd(){document.querySelectorAll('.nt-chip .chip-t').forEach(c=>{const e=c.previousSibling&&c.parentNode.previousElementSibling;const n=e&&e._n;if(n)c.textContent=mmss(buildEnd(n)-Date.now())});LIST.forEach(n=>{const el=host()&&host().querySelector('.nt[data-id="'+(window.CSS&&CSS.escape?CSS.escape(n.id):n.id)+'"] .cdt');if(el)el.textContent=countdown(n)});sync()}
function set(list){LIST=(list||[]).slice();sync()}
function add(n){LIST=LIST.filter(x=>x.id!==n.id);LIST.push(n);sync()}
function remove(id){LIST=LIST.filter(x=>x.id!==id);sync()}
function clear(){LIST=[];EXPANDED=false;sync()}
function reset(){try{localStorage.removeItem(KEY)}catch(e){}sync()}
async function load(){
  try{const r=await fetch(CONFIG.api.list,{credentials:'include',headers:{Accept:'application/json'}});if(!r.ok)return;const j=await r.json();set(j.notices||[])}catch(e){}
}
document.addEventListener('click',e=>{
  const H=host();if(!H||!H.contains(e.target))return;
  const x=e.target.closest('.nt-x');
  if(x){const el=x.closest('.nt'),n=LIST.find(y=>y.id===el.dataset.id);saveDismiss(el.dataset.id,n&&n.version);sync();return}
  if(e.target.closest('.nt-more')){EXPANDED=!EXPANDED;sync();return}
  const p=e.target.closest('.nt-p');if(p)p.closest('.nt').classList.toggle('open');
});
setInterval(tickCd,1000);
window.OisNotify={set:set,add:add,remove:remove,clear:clear,reset:reset,load:load};
if(!CONFIG.DEMO){load();setInterval(load,CONFIG.pollSec*1000)}
/* ===== konec komponenty ===== */

/* ---------- ukázka (jen když DEMO:true) ---------- */
const iso=min=>new Date(Date.now()+min*60000).toISOString();
const DEMO={
  rebuild:()=>({id:'demo-rebuild',type:'rebuild',demo:true,title:'Probíhá předělávání webu',text:'Web postupně přestavujeme do nového vzhledu. Některé stránky se mohou chovat jinak a data mohou být dočasně neúplná. Děkujeme za trpělivost.',progress:62,link:{url:'#',label:'Co je nového'}}),
  maintenance:()=>({id:'demo-maint',type:'maintenance',demo:true,title:'Plánovaná údržba',text:'V této době nebude web dostupný. Mapa a jízdní řády se po skončení údržby obnoví samy.',startsAt:iso(14),endsAt:iso(74)}),
  danger:()=>({id:'demo-danger',type:'danger',demo:true,title:'Výpadek dat o poloze vozidel',text:'Aktuálně nemáme data od části dopravců. Mapa může ukazovat zpožděné polohy. Na opravě pracujeme.'}),
  warning:()=>({id:'demo-warn',type:'warning',demo:true,title:'Změna provozu',text:'Od pondělí platí nový jízdní řád linky 722. Zkontrolujte si prosím své spoje.',link:{url:'#',label:'Zobrazit řád'}}),
  info:()=>({id:'demo-info',type:'info',demo:true,title:'Novinka: jízdní řád',text:'Přidali jsme nový jízdní řád s chytrým hledáním zastávek.',link:{url:'#',label:'Vyzkoušet'}}),
  build:()=>({id:'demo-build',type:'build',demo:true,demoPage:'map',startedAt:new Date().toISOString()}),
  buildOther:()=>({id:'demo-build2',type:'build',demo:true,demoPage:'other',startedAt:new Date().toISOString()}),
  success:()=>({id:'demo-ok',type:'success',demo:true,title:'Vše funguje',text:'Data jsou znovu aktuální. Děkujeme za trpělivost.'})
};
if(CONFIG.DEMO){
  document.getElementById('demoBtns').addEventListener('click',e=>{
    const b=e.target.closest('[data-n]');if(!b)return;const k=b.dataset.n;
    if(k==='clear')return clear();if(k==='build'||k==='buildOther'){remove('demo-build');remove('demo-build2')}if(k==='reset')return reset();
    if(k==='many'){reset();return set(['build','rebuild','maintenance','danger','warning','info'].map(x=>DEMO[x]()))}
    reset();add(DEMO[k]())});

}
})();

</script>
