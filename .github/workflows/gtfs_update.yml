name: GTFS Automated Update Pipeline

on:
  schedule:
    - cron: '0 3 * * *' # Běží každý den v 3:00 UTC
  workflow_dispatch: # Povoluje ruční spuštění pro testování a prvotní nasazení

jobs:
  gtfs-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nutné pro vytváření a mazání GitHub Releases

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace závislostí
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Spuštění GTFS aktualizačního skriptu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GTFS_SOURCE_URL: 'https://www.spojenka.cz/jrdata/jizdnirady-gtfs.zip'
        run: |
          python scripts/gtfs_updater.py

      - name: Vytvoření GitHub Release a nahrání aktiv
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f .release_tag ]; then
            TAG=$(cat .release_tag)
            echo "Publikuji release $TAG"
            gh release create "$TAG" gtfs.zip gtfs_stops_*.db --title "GTFS Update $TAG" --notes-file .release_notes.md
          else
            echo "Soubor .release_tag nenalezen. Pravděpodobně nenastala žádná změna ve zdrojových databázi."
          fi

      - name: Retence starých verzí (ponechat pouze 3 nejnovější)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --exclude-drafts --exclude-pre-releases | grep 'gtfs-' | awk '{print $1}')
          COUNT=$(echo "$RELEASES" | wc -l)
          if [ "$COUNT" -gt 3 ]; then
            echo "Našel jsem $COUNT verzí, mažu ty nejstarší (nad limit 3)."
            TO_DELETE=$(echo "$RELEASES" | tail -n +4)
            for REL in $TO_DELETE; do
              echo "Mažu release a tag: $REL"
              gh release delete "$REL" -y --cleanup-tag
            done
          else
            echo "Retence: $COUNT verzí je v pořádku (limit 3)."
          fi

      - name: Odeslání Discord notifikace – Úspěch
        if: success()
        run: |
          if [ -f .discord_msg.txt ]; then
            MSG=$(cat .discord_msg.txt)
          else
            MSG="✅ **GTFS data úspěšně aktualizována!**"
          fi
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": $(echo "$MSG" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}"

      - name: Odeslání Discord notifikace – Selhání
        if: failure()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="❌ **GTFS Update SELHAL!**\n- **Workflow:** ${{ github.workflow }}\n- **Datum:** $(date -u '+%Y-%m-%d %H:%M UTC')\n- **Logy:** $RUN_URL"
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": $(echo -e "$MSG" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}"
